name: Tokenizer tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run the implemented CS336 tokenizer tests
        run: uv run pytest -q tests/test_tokenizer.py tests/test_train_bpe.py
